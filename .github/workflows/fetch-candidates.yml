name: Fetch candidates

# Collects real metadata from official APIs (no AI calls) so the Claude runs
# select from verified data. 01:47 UTC is 07:17 IST, after arXiv's new papers are out (20:00 New York time, 01:00 UTC in winter, 00:00 in summer).
# 02:23 UTC (07:53 IST) is a gap-filling run: it refetches only sources that failed
# earlier, so a rate limit or outage is repaired before the 08:13 Daily run.
on:
  schedule:
    # arXiv announces new papers at 20:00 New York time (01:00 UTC in winter). GitHub can start
    # scheduled runs hours late, so the daily run also starts this workflow itself when files are
    # missing (dsys.py candidates ensure). Odd minutes avoid the busy top of the hour.
    - cron: "47 1 * * *"
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      retry_only:
        description: "Only refetch sources that failed earlier today"
        type: boolean
        default: false
      kinds:
        description: "Which sources to fetch: all, or a comma list of arxiv,news,youtube,videos,podcasts,updates,hf"
        type: string
        default: "all"

permissions:
  contents: write

concurrency:
  group: candidates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "23 2 * * *" ] || [ "${{ inputs.retry_only }}" = "true" ]; then
            echo "flag=--retry-failed" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: arXiv, Hugging Face, alphaXiv (weekdays)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'arxiv') }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" -gt 5 ]; then echo "weekend: skip arXiv"; exit 0; fi
          python scripts/fetch_candidates.py arxiv ${{ steps.mode.outputs.flag }}
          # In-job second chance: wait, then refetch only what failed.
          if python -c "import json,sys,datetime as d,zoneinfo as z;f='candidates/arxiv/'+d.datetime.now(z.ZoneInfo('Asia/Kolkata')).date().isoformat()+'.json';sys.exit(0 if json.load(open(f)).get('failed_sources') else 1)"; then
            echo "some sources failed; retrying them in 120 s"; sleep 120
            python scripts/fetch_candidates.py arxiv --retry-failed
          fi
      - name: News headlines (every day)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'news') }}
        run: |
          python scripts/fetch_candidates.py news ${{ steps.mode.outputs.flag }}
          if python -c "import json,sys,datetime as d,zoneinfo as z;f='candidates/news/'+d.datetime.now(z.ZoneInfo('Asia/Kolkata')).date().isoformat()+'.json';sys.exit(0 if json.load(open(f)).get('failed_sources') else 1)"; then
            echo "some feeds failed; retrying them in 60 s"; sleep 60
            python scripts/fetch_candidates.py news --retry-failed
          fi
      - name: YouTube (only if YOUTUBE_API_KEY secret is set)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'youtube') }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_candidates.py youtube ${{ steps.mode.outputs.flag }}
      - name: Long-form YouTube (lectures, documentaries, talks)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'videos') }}
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_candidates.py videos ${{ steps.mode.outputs.flag }}
      - name: Podcasts (show feeds and episode search)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'podcasts') }}
        continue-on-error: true
        run: python scripts/fetch_candidates.py podcasts ${{ steps.mode.outputs.flag }}
      - name: Research updates (blogs, newsletters, Hacker News, r/MachineLearning)
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'updates') }}
        continue-on-error: true
        run: python scripts/fetch_candidates.py updates ${{ steps.mode.outputs.flag }}
      - name: Hugging Face trending models, datasets, spaces
        if: ${{ !inputs.kinds || inputs.kinds == 'all' || contains(inputs.kinds, 'hf') }}
        continue-on-error: true
        run: python scripts/fetch_candidates.py hf ${{ steps.mode.outputs.flag }}
      - name: Prune old candidates
        run: python scripts/fetch_candidates.py prune --keep-days 14
      - name: Commit
        run: |
          git config user.name "dsys-bot"
          git config user.email "dsys-bot@users.noreply.github.com"
          git add candidates
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "candidates: $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push failed (attempt $i), retrying in 15 s"; sleep 15
          done
          exit 1
